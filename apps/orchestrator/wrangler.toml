name = "scribe-drop-orchestrator-local"
main = "src/index.ts"
compatibility_date = "2026-07-25"
workers_dev = false

[triggers]
crons = ["*/5 * * * *"]

[vars]
APP_ENV = "local"
AUDIT_RETENTION_DAYS = "180"
CLOUDFLARE_ACCOUNT_ID = "00000000000000000000000000000000"
MULTIPART_RETENTION_HOURS = "24"
R2_BUCKET_NAME = "scribe-drop-local"
RESULT_RETENTION_DAYS = "90"
RUNPOD_INTERNAL_BASE_URL = "https://orchestrator.example.invalid"
SOURCE_RETENTION_DAYS = "7"
WEB_BASE_URL = "http://localhost:5173"

[[d1_databases]]
binding = "SCRIBE_DROP_DB"
database_name = "scribe-drop-local"
database_id = "00000000-0000-0000-0000-000000000001"
migrations_dir = "../../migrations"

[[r2_buckets]]
binding = "RECORDINGS"
bucket_name = "scribe-drop-local"

[[queues.consumers]]
queue = "recording-uploaded-local"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 5
retry_delay = 60
dead_letter_queue = "recording-uploaded-dlq-local"

[env.staging]
name = "scribe-drop-orchestrator-staging"
routes = [
  { pattern = "replace-with-staging-orchestrator.example.invalid", custom_domain = true },
]

[env.staging.triggers]
crons = ["*/5 * * * *"]

[env.staging.vars]
APP_ENV = "staging"
AUDIT_RETENTION_DAYS = "180"
CLOUDFLARE_ACCOUNT_ID = "00000000000000000000000000000000"
MULTIPART_RETENTION_HOURS = "24"
R2_BUCKET_NAME = "recording-transcriber-staging"
RESULT_RETENTION_DAYS = "90"
RUNPOD_INTERNAL_BASE_URL = "https://replace-with-staging-orchestrator.example.invalid"
SOURCE_RETENTION_DAYS = "7"
WEB_BASE_URL = "https://replace-with-staging-web.example.invalid"

[[env.staging.d1_databases]]
binding = "SCRIBE_DROP_DB"
database_name = "scribe-drop-staging"
database_id = "00000000-0000-0000-0000-000000000101"
migrations_dir = "../../migrations"

[[env.staging.r2_buckets]]
binding = "RECORDINGS"
bucket_name = "recording-transcriber-staging"

[[env.staging.queues.consumers]]
queue = "recording-uploaded-staging"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 5
retry_delay = 60
dead_letter_queue = "recording-uploaded-dlq-staging"
