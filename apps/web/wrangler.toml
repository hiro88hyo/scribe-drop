name = "scribe-drop-web-staging"
pages_build_output_dir = "./dist"
compatibility_date = "2026-07-25"

[vars]
ACCESS_AUDIENCES = "[\"replace-with-access-audience\"]"
ACCESS_TEAM_DOMAIN = "https://replace-with-team.cloudflareaccess.com"
ALLOWED_ORIGIN = "https://replace-with-staging-web.example.invalid"
APP_ENV = "staging"
CLOUDFLARE_ACCOUNT_ID = "00000000000000000000000000000000"
R2_BUCKET_NAME = "recording-transcriber-staging"

[secrets]
required = [
  "CSRF_HMAC_SECRET",
  "OWNER_HASH_HMAC_SECRET",
  "R2_PARENT_ACCESS_KEY_ID",
  "R2_PARENT_SECRET_ACCESS_KEY",
]

[[d1_databases]]
binding = "SCRIBE_DROP_DB"
database_name = "scribe-drop-staging"
database_id = "00000000-0000-0000-0000-000000000101"

[[r2_buckets]]
binding = "RECORDINGS"
bucket_name = "recording-transcriber-staging"
