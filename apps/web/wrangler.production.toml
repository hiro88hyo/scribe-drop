name = "scribe-drop-web-production"
pages_build_output_dir = "./dist"
compatibility_date = "2026-07-25"

[vars]
ACCESS_AUDIENCES = "[\"replace-with-access-audience\"]"
ACCESS_TEAM_DOMAIN = "https://replace-with-team.cloudflareaccess.com"
ALLOWED_ORIGIN = "https://replace-with-production-web.example.invalid"
APP_ENV = "production"
CLOUDFLARE_ACCOUNT_ID = "00000000000000000000000000000000"
R2_BUCKET_NAME = "recording-transcriber-production"

[[d1_databases]]
binding = "SCRIBE_DROP_DB"
database_name = "scribe-drop-production"
database_id = "00000000-0000-0000-0000-000000000201"

[[r2_buckets]]
binding = "RECORDINGS"
bucket_name = "recording-transcriber-production"

[[queues.producers]]
binding = "CONTROL_EVENTS"
queue = "recording-uploaded-production"
