[project]
name = "scribe-drop-runpod-worker"
version = "0.0.0"
description = "RunPod Serverless worker for ScribeDrop"
requires-python = ">=3.12,<3.13"
dependencies = [
    "ctranslate2==4.8.1",
    "faster-whisper==1.2.1",
    "httpx==0.28.1",
    "pydantic==2.13.4",
    "runpod==1.11.0",
]

[dependency-groups]
dev = [
    "mypy==2.3.0",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.15.22",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.format]
docstring-code-format = true
line-ending = "lf"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",
    "D203",
    "D213",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
files = ["src", "tests"]
mypy_path = "src"
python_version = "3.12"
strict = true
warn_unreachable = true

[tool.pytest.ini_options]
addopts = [
    "--strict-config",
    "--strict-markers",
    "--cov=scribe_drop_worker",
    "--cov-report=term-missing",
    "--cov-fail-under=90",
]
pythonpath = ["src"]
testpaths = ["tests"]
