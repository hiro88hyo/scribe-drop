name: Promote staging-accepted candidate to production

on:
  workflow_dispatch:
    inputs:
      operation:
        description: cutover opens one approved smoke slot; finalize verifies it and opens the reviewed operational window
        required: true
        type: choice
        options:
          - cutover
          - finalize
      staging_run_id:
        description: Successful staging acceptance workflow run ID
        required: true
        type: string
      candidate_commit_sha:
        description: Exact immutable candidate commit accepted by staging
        required: true
        type: string
      preflight_only:
        description: Verify all cutover prerequisites without changing production
        default: false
        required: false
        type: boolean
      preflight_run_id:
        description: Successful mutation-free production preflight run; use 0 during preflight and finalize
        required: true
        default: "0"
        type: string
      cutover_run_id:
        description: Cutover workflow run ID for finalize; use 0 for cutover
        required: true
        default: "0"
        type: string
      production_smoke_job_id:
        description: User-confirmed production smoke ULID for finalize; use none for cutover
        required: true
        default: none
        type: string
      operational_max_executions:
        description: Reviewed operational execution cap for finalize; use 0 for cutover
        required: true
        default: "0"
        type: string
      operational_max_worst_case_jpy:
        description: Exact 250 JPY per execution budget for finalize; use 0 for cutover
        required: true
        default: "0"
        type: string
      operational_valid_until:
        description: ISO expiry within 24 hours for finalize; use epoch for cutover
        required: true
        default: "1970-01-01T00:00:00.000Z"
        type: string

run-name: Production ${{ inputs.preflight_only && 'preflight' || inputs.operation }} from staging run ${{ inputs.staging_run_id }}

permissions:
  actions: read
  contents: read

concurrency:
  group: scribe-drop-production-promotion
  cancel-in-progress: false

env:
  VOLTA_FEATURE_PNPM: "1"
  WRANGLER_WRITE_LOGS: "0"

jobs:
  verify-promotion:
    name: Verify immutable candidate, acceptance, and operation inputs
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CANDIDATE_COMMIT_SHA: ${{ inputs.candidate_commit_sha }}
      EXPECTED_COMMIT_SHA: ${{ inputs.candidate_commit_sha }}
      EXPECTED_RELEASE_BRANCH: ${{ github.ref_name }}
      RELEASE_CANDIDATE_DIRECTORY: ${{ github.workspace }}/release-candidate
    steps:
      - name: Check out release commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Volta
        uses: volta-cli/action@615a78f6c83e116339c53b94f3f82b4d6c0b7d18 # v5.0.0
        with:
          volta-version: 2.0.2

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate source-managed production workflow contract
        run: pnpm run production:dispatch:verify

      - name: Validate bounded production operation inputs
        env:
          CUTOVER_RUN_ID: ${{ inputs.cutover_run_id }}
          CANDIDATE_COMMIT_SHA: ${{ inputs.candidate_commit_sha }}
          OPERATIONAL_MAX_EXECUTIONS: ${{ inputs.operational_max_executions }}
          OPERATIONAL_MAX_WORST_CASE_JPY: ${{ inputs.operational_max_worst_case_jpy }}
          OPERATIONAL_VALID_UNTIL: ${{ inputs.operational_valid_until }}
          PRODUCTION_OPERATION: ${{ inputs.operation }}
          PRODUCTION_PREFLIGHT_ONLY: ${{ inputs.preflight_only }}
          PRODUCTION_PREFLIGHT_RUN_ID: ${{ inputs.preflight_run_id }}
          PRODUCTION_SMOKE_JOB_ID: ${{ inputs.production_smoke_job_id }}
          STAGING_RUN_ID: ${{ inputs.staging_run_id }}
        run: pnpm run production:promotion:inputs:verify

      - name: Validate release and staging run identities
        env:
          GH_TOKEN: ${{ github.token }}
          STAGING_RUN_ID: ${{ inputs.staging_run_id }}
        run: |
          case "${GITHUB_REF}" in
            refs/heads/release/*)
              release_version="${GITHUB_REF#refs/heads/release/}"
              ;;
            *)
              echo "Production accepts candidates only from release branches" >&2
              exit 1
              ;;
          esac
          test "${release_version}" = "$(node -p "require('./package.json').version")"
          printf 'EXPECTED_RELEASE_VERSION=%s\n' "${release_version}" >>"${GITHUB_ENV}"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${STAGING_RUN_ID}" \
            >"${RUNNER_TEMP}/staging-run.json"
          EXPECTED_COMMIT_SHA="${GITHUB_SHA}" node scripts/verify-workflow-run.mjs \
            "${RUNNER_TEMP}/staging-run.json" \
            .github/workflows/deploy-staging-candidate.yml \
            "${STAGING_RUN_ID}"

      - name: Download and inspect immutable staging evidence
        env:
          GH_TOKEN: ${{ github.token }}
          STAGING_RUN_ID: ${{ inputs.staging_run_id }}
        run: |
          gh run download "${STAGING_RUN_ID}" \
            --name "scribe-drop-staging-acceptance-${CANDIDATE_COMMIT_SHA}" \
            --dir staging-acceptance
          node scripts/export-staging-acceptance-identity.mjs staging-acceptance

      - name: Download and verify both exact candidates
        env:
          GH_TOKEN: ${{ github.token }}
          STAGING_RUN_ID: ${{ inputs.staging_run_id }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${CANDIDATE_RUN_ID}" \
            >"${RUNNER_TEMP}/candidate-run.json"
          node scripts/verify-workflow-run.mjs \
            "${RUNNER_TEMP}/candidate-run.json" \
            .github/workflows/publish-runpod-worker.yml \
            "${CANDIDATE_RUN_ID}"
          gh run download "${CANDIDATE_RUN_ID}" \
            --name "scribe-drop-release-candidate-${CANDIDATE_COMMIT_SHA}" \
            --dir "${RELEASE_CANDIDATE_DIRECTORY}"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${CLOUD_RUN_CANDIDATE_RUN_ID}" \
            >"${RUNNER_TEMP}/cloud-run-candidate-run.json"
          node scripts/verify-workflow-run.mjs \
            "${RUNNER_TEMP}/cloud-run-candidate-run.json" \
            .github/workflows/publish-cloud-run-candidate.yml \
            "${CLOUD_RUN_CANDIDATE_RUN_ID}"
          cloud_run_attempt="$(node -p "JSON.parse(require('node:fs').readFileSync(process.argv[1], 'utf8')).run_attempt" "${RUNNER_TEMP}/cloud-run-candidate-run.json")"
          gh run download "${CLOUD_RUN_CANDIDATE_RUN_ID}" \
            --name "scribe-drop-cloud-run-candidate-${CANDIDATE_COMMIT_SHA}-${CLOUD_RUN_CANDIDATE_RUN_ID}-${cloud_run_attempt}" \
            --dir cloud-run-candidate
          pnpm run candidate:verify "${RELEASE_CANDIDATE_DIRECTORY}"
          pnpm run cloud-run:candidate:evidence verify cloud-run-candidate/cloud-run-candidate.json
          EXPECTED_CANDIDATE_RUN_ID="${CANDIDATE_RUN_ID}" \
            EXPECTED_CLOUD_RUN_CANDIDATE_RUN_ID="${CLOUD_RUN_CANDIDATE_RUN_ID}" \
            EXPECTED_STAGING_RUN_ID="${STAGING_RUN_ID}" \
            MINIMUM_ACCEPTANCE_REMAINING_SECONDS="3600" \
            pnpm run staging:acceptance:verify \
              "${RELEASE_CANDIDATE_DIRECTORY}" \
              staging-acceptance

      - name: Verify successful mutation-free production preflight before cutover
        if: inputs.operation == 'cutover' && !inputs.preflight_only
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCTION_PREFLIGHT_RUN_ID: ${{ inputs.preflight_run_id }}
          STAGING_RUN_ID: ${{ inputs.staging_run_id }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${PRODUCTION_PREFLIGHT_RUN_ID}" \
            >"${RUNNER_TEMP}/production-preflight-run.json"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${PRODUCTION_PREFLIGHT_RUN_ID}/jobs?filter=latest&per_page=100" \
            >"${RUNNER_TEMP}/production-preflight-jobs.json"
          pnpm run production:preflight:verify \
            "${RUNNER_TEMP}/production-preflight-run.json" \
            "${RUNNER_TEMP}/production-preflight-jobs.json"

      - name: Verify immutable cutover evidence for finalize
        if: inputs.operation == 'finalize'
        env:
          CUTOVER_RUN_ID: ${{ inputs.cutover_run_id }}
          GH_TOKEN: ${{ github.token }}
          STAGING_RUN_ID: ${{ inputs.staging_run_id }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${CUTOVER_RUN_ID}" \
            >"${RUNNER_TEMP}/cutover-run.json"
          node scripts/verify-reusable-workflow-run.mjs \
            "${RUNNER_TEMP}/cutover-run.json" \
            .github/workflows/deploy-production-candidate.yml \
            "${CUTOVER_RUN_ID}"
          gh run download "${CUTOVER_RUN_ID}" \
            --name "scribe-drop-production-cutover-${CANDIDATE_COMMIT_SHA}-${CUTOVER_RUN_ID}" \
            --dir production-cutover
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${CUTOVER_RUN_ID}" \
            >"${RUNNER_TEMP}/cutover-run.json"
          printf 'CUTOVER_RUN_PATH=%s\n' "${RUNNER_TEMP}/cutover-run.json" >>"${GITHUB_ENV}"
          EXPECTED_CUTOVER_RUN_ID="${CUTOVER_RUN_ID}" \
            pnpm run production:cutover:evidence verify production-cutover

  cutover:
    name: Cut over safely and open exactly one production smoke slot
    if: inputs.operation == 'cutover'
    needs: verify-promotion
    environment: production
    permissions:
      actions: read
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      AUDIT_RETENTION_DAYS: ${{ vars.AUDIT_RETENTION_DAYS }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CANDIDATE_COMMIT_SHA: ${{ inputs.candidate_commit_sha }}
      EXPECTED_COMMIT_SHA: ${{ inputs.candidate_commit_sha }}
      EXPECTED_RELEASE_BRANCH: ${{ github.ref_name }}
      MULTIPART_RETENTION_HOURS: ${{ vars.MULTIPART_RETENTION_HOURS }}
      RELEASE_CANDIDATE_DIRECTORY: ${{ github.workspace }}/release-candidate
      RESULT_RETENTION_DAYS: ${{ vars.RESULT_RETENTION_DAYS }}
      SCRIBE_DROP_CANDIDATE_MIGRATIONS_DIR: ../../release-candidate/migrations
      SCRIBE_DROP_PRODUCTION_ACCESS_AUDIENCE: ${{ vars.SCRIBE_DROP_PRODUCTION_ACCESS_AUDIENCE }}
      SCRIBE_DROP_PRODUCTION_ACCESS_TEAM_DOMAIN: ${{ vars.SCRIBE_DROP_PRODUCTION_ACCESS_TEAM_DOMAIN }}
      SCRIBE_DROP_PRODUCTION_CLOUD_RUN_CONTROLLER_HMAC_SECRET_VERSION: ${{ vars.SCRIBE_DROP_PRODUCTION_CLOUD_RUN_CONTROLLER_HMAC_SECRET_VERSION }}
      SCRIBE_DROP_PRODUCTION_CLOUD_RUN_RUNTIME_MODE: active
      SCRIBE_DROP_PRODUCTION_CLOUD_RUN_RUNTIME_SERVICE_ACCOUNT: gpu-runtime-production@scribe-drop.iam.gserviceaccount.com
      SCRIBE_DROP_PRODUCTION_D1_DATABASE_ID: ${{ vars.SCRIBE_DROP_PRODUCTION_D1_DATABASE_ID }}
      SCRIBE_DROP_PRODUCTION_ORCHESTRATOR_ORIGIN: ${{ vars.SCRIBE_DROP_PRODUCTION_ORCHESTRATOR_ORIGIN }}
      SCRIBE_DROP_PRODUCTION_PAGES_PROJECT: ${{ vars.SCRIBE_DROP_PRODUCTION_PAGES_PROJECT }}
      SCRIBE_DROP_PRODUCTION_RUNPOD_GPU_IDS: ${{ vars.SCRIBE_DROP_PRODUCTION_RUNPOD_GPU_IDS }}
      SCRIBE_DROP_PRODUCTION_RUNPOD_IMAGE_VISIBILITY: ${{ vars.SCRIBE_DROP_PRODUCTION_RUNPOD_IMAGE_VISIBILITY }}
      SCRIBE_DROP_PRODUCTION_RUNPOD_REGISTRY_AUTH_ID: ${{ vars.SCRIBE_DROP_PRODUCTION_RUNPOD_REGISTRY_AUTH_ID }}
      SCRIBE_DROP_PRODUCTION_WEB_ORIGIN: ${{ vars.SCRIBE_DROP_PRODUCTION_WEB_ORIGIN }}
      SOURCE_RETENTION_DAYS: ${{ vars.SOURCE_RETENTION_DAYS }}
    steps:
      - name: Check out release commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Volta
        uses: volta-cli/action@615a78f6c83e116339c53b94f3f82b4d6c0b7d18 # v5.0.0
        with:
          volta-version: 2.0.2

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Authenticate isolated production deployer
        id: google-auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: projects/601035271372/locations/global/workloadIdentityPools/scribe-drop-release/providers/github-production-deployment
          service_account: sd-production-deployer@scribe-drop.iam.gserviceaccount.com
          project_id: scribe-drop
          token_format: access_token
          access_token_lifetime: 3600s

      - name: Set up pinned Google Cloud CLI
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          version: 579.0.0
          project_id: scribe-drop

      - name: Install checksummed RunPod CLI
        run: pnpm run runpodctl:install

      - name: Download acceptance and export exact candidate identity
        env:
          GH_TOKEN: ${{ github.token }}
          STAGING_RUN_ID: ${{ inputs.staging_run_id }}
        run: |
          printf 'EXPECTED_RELEASE_VERSION=%s\n' "$(node -p "require('./package.json').version")" >>"${GITHUB_ENV}"
          printf 'SCRIBE_DROP_PRODUCTION_R2_HOST=%s.r2.cloudflarestorage.com\n' "${CLOUDFLARE_ACCOUNT_ID}" >>"${GITHUB_ENV}"
          workflow_created_at="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" --jq .created_at)"
          authorization_expiry="$(node -p 'new Date(Date.parse(process.argv[1]) + 2 * 60 * 60 * 1000).toISOString()' "${workflow_created_at}")"
          printf 'SCRIBE_DROP_CLOUD_RUN_AUTHORIZATION_EPOCH=phase16-smoke-%s-%s\n' \
            "${CANDIDATE_COMMIT_SHA}" "${GITHUB_RUN_ID}" >>"${GITHUB_ENV}"
          printf 'SCRIBE_DROP_CLOUD_RUN_AUTHORIZATION_VALID_UNTIL=%s\n' \
            "${authorization_expiry}" >>"${GITHUB_ENV}"
          gh run download "${STAGING_RUN_ID}" \
            --name "scribe-drop-staging-acceptance-${CANDIDATE_COMMIT_SHA}" \
            --dir staging-acceptance
          node scripts/export-staging-acceptance-identity.mjs staging-acceptance

      - name: Download and re-verify exact candidates
        env:
          GH_TOKEN: ${{ github.token }}
          STAGING_RUN_ID: ${{ inputs.staging_run_id }}
        run: |
          gh run download "${CANDIDATE_RUN_ID}" \
            --name "scribe-drop-release-candidate-${CANDIDATE_COMMIT_SHA}" \
            --dir "${RELEASE_CANDIDATE_DIRECTORY}"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${CLOUD_RUN_CANDIDATE_RUN_ID}" \
            >"${RUNNER_TEMP}/cloud-run-candidate-run.json"
          cloud_run_attempt="$(node -p "JSON.parse(require('node:fs').readFileSync(process.argv[1], 'utf8')).run_attempt" "${RUNNER_TEMP}/cloud-run-candidate-run.json")"
          gh run download "${CLOUD_RUN_CANDIDATE_RUN_ID}" \
            --name "scribe-drop-cloud-run-candidate-${CANDIDATE_COMMIT_SHA}-${CLOUD_RUN_CANDIDATE_RUN_ID}-${cloud_run_attempt}" \
            --dir cloud-run-candidate
          printf 'CLOUD_RUN_CANDIDATE_EVIDENCE_PATH=%s\n' \
            "${GITHUB_WORKSPACE}/cloud-run-candidate/cloud-run-candidate.json" >>"${GITHUB_ENV}"
          pnpm run candidate:verify "${RELEASE_CANDIDATE_DIRECTORY}"
          pnpm run cloud-run:candidate:evidence verify cloud-run-candidate/cloud-run-candidate.json
          EXPECTED_CANDIDATE_RUN_ID="${CANDIDATE_RUN_ID}" \
            EXPECTED_CLOUD_RUN_CANDIDATE_RUN_ID="${CLOUD_RUN_CANDIDATE_RUN_ID}" \
            EXPECTED_STAGING_RUN_ID="${STAGING_RUN_ID}" \
            MINIMUM_ACCEPTANCE_REMAINING_SECONDS="2700" \
            pnpm run staging:acceptance:verify "${RELEASE_CANDIDATE_DIRECTORY}" staging-acceptance

      - name: Build verifier and strictly read production foundation
        env:
          GOOGLE_OAUTH_ACCESS_TOKEN: ${{ steps.google-auth.outputs.access_token }}
          SCRIBE_DROP_CLOUD_RUN_EXPECTED_AUTHORIZATION_EPOCH: disabled
          SCRIBE_DROP_CLOUD_RUN_EXPECTED_RESERVED_EXECUTIONS: "0"
        run: |
          pnpm run workflow:build:gpu-controller
          pnpm run cloud-run:foundation:read production
          pnpm run cloud-run:controller:deploy preflight production disabled \
            "${CLOUD_RUN_CANDIDATE_EVIDENCE_PATH}"
          pnpm run cloud-run:production:origin:export

      - name: Render disabled preflight configuration
        env:
          SCRIBE_DROP_PRODUCTION_CLOUD_RUN_RUNTIME_MODE: disabled
          SCRIBE_DROP_PRODUCTION_GPU_EXECUTION_ADMISSION: paused
          SCRIBE_DROP_PRODUCTION_GPU_EXECUTION_POLICY: runpod_serverless_v1
        run: |
          pnpm run candidate:pages "${RELEASE_CANDIDATE_DIRECTORY}" pages-candidate
          pnpm run cloudflare:config:production
          pnpm run runpod:config:production

      - name: Verify accepted production environment policy before external access
        env:
          MINIMUM_ACCEPTANCE_REMAINING_SECONDS: "2700"
          SCRIBE_DROP_PRODUCTION_GPU_EXECUTION_ADMISSION: active
          SCRIBE_DROP_PRODUCTION_GPU_EXECUTION_POLICY: cloud_run_jobs_l4_v1
          STAGING_RUN_ID: ${{ inputs.staging_run_id }}
        run: |
          pnpm run environment:policy:export production
          EXPECTED_CANDIDATE_RUN_ID="${CANDIDATE_RUN_ID}" \
            EXPECTED_CLOUD_RUN_CANDIDATE_RUN_ID="${CLOUD_RUN_CANDIDATE_RUN_ID}" \
            EXPECTED_STAGING_RUN_ID="${STAGING_RUN_ID}" \
            pnpm run staging:acceptance:verify "${RELEASE_CANDIDATE_DIRECTORY}" staging-acceptance

      - name: Verify every external control plane before production mutation
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_PAGES_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          SCRIBE_DROP_PRODUCTION_PAGES_PROJECT: ${{ vars.SCRIBE_DROP_PRODUCTION_PAGES_PROJECT }}
          SCRIBE_DROP_PRODUCTION_RUNPOD_ENDPOINT_ID: ${{ secrets.SCRIBE_DROP_PRODUCTION_RUNPOD_ENDPOINT_ID }}
        run: |
          pnpm run cloudflare:worker-route:verify:production
          pnpm run cloudflare:pages:upload-permission:verify:production
          pnpm run cloudflare:secrets:verify:production:pages
          pnpm run cloudflare:access:verify:production
          pnpm run runpod:preflight:production
          CLOUDFLARE_API_TOKEN="${CLOUDFLARE_PAGES_API_TOKEN}" \
            pnpm exec wrangler pages deployment list \
            --cwd apps/web \
            --project-name "${SCRIBE_DROP_PRODUCTION_PAGES_PROJECT}" \
            --environment production \
            --json >"${RUNNER_TEMP}/pages-deployment-preflight.json"
          test -s "${RUNNER_TEMP}/pages-deployment-preflight.json"

      - name: Apply candidate migrations and reviewed R2 policies
        if: ${{ !inputs.preflight_only }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          pnpm exec wrangler d1 migrations apply SCRIBE_DROP_DB \
            --remote \
            --config .wrangler/deploy/orchestrator-production.toml \
            --env production
          pnpm exec wrangler r2 bucket cors set recording-transcriber-production \
            --file .wrangler/deploy/r2-cors-production.json \
            --config .wrangler/deploy/orchestrator-production.toml \
            --env production \
            --force
          pnpm exec wrangler r2 bucket lifecycle set recording-transcriber-production \
            --file .wrangler/deploy/r2-lifecycle-production.json \
            --config .wrangler/deploy/orchestrator-production.toml \
            --env production \
            --force

      - name: Promote exact rollback-compatible RunPod image without execution
        if: ${{ !inputs.preflight_only }}
        env:
          EXPECTED_STAGING_RUN_ID: ${{ inputs.staging_run_id }}
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          SCRIBE_DROP_PRODUCTION_RUNPOD_ENDPOINT_ID: ${{ secrets.SCRIBE_DROP_PRODUCTION_RUNPOD_ENDPOINT_ID }}
          STAGING_ACCEPTANCE_PATH: staging-acceptance/staging-acceptance.json
        run: pnpm run runpod:promote:production

      - name: Deploy bounded controller behind the existing RunPod selection
        if: ${{ !inputs.preflight_only }}
        env:
          GOOGLE_OAUTH_ACCESS_TOKEN: ${{ steps.google-auth.outputs.access_token }}
        run: |
          pnpm run cloud-run:controller:deploy apply production smoke \
            "${CLOUD_RUN_CANDIDATE_EVIDENCE_PATH}"
          pnpm run cloud-run:production:origin:export

      - name: Deploy exact application candidate with admission paused
        if: ${{ !inputs.preflight_only }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_PAGES_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
          SCRIBE_DROP_PRODUCTION_CLOUD_RUN_CONTROLLER_HMAC_PRIMARY: ${{ secrets.SCRIBE_DROP_PRODUCTION_CLOUD_RUN_CONTROLLER_HMAC_PRIMARY }}
          SCRIBE_DROP_PRODUCTION_CLOUD_RUN_RUNTIME_DERIVATION_SECRET: ${{ secrets.SCRIBE_DROP_PRODUCTION_CLOUD_RUN_RUNTIME_DERIVATION_SECRET }}
          SCRIBE_DROP_PRODUCTION_GPU_EXECUTION_ADMISSION: paused
          SCRIBE_DROP_PRODUCTION_GPU_EXECUTION_POLICY: runpod_serverless_v1
        run: |
          pnpm run cloudflare:config:production
          pnpm run cloud-run:production:worker-secrets:put
          pnpm exec wrangler deploy "${RELEASE_CANDIDATE_DIRECTORY}/orchestrator/index.js" \
            --no-bundle \
            --strict \
            --tag "candidate-${CANDIDATE_COMMIT_SHA}" \
            --message "release candidate ${CANDIDATE_COMMIT_SHA}" \
            --config .wrangler/deploy/orchestrator-production.toml \
            --env production
          CLOUDFLARE_API_TOKEN="${CLOUDFLARE_PAGES_API_TOKEN}" \
            pnpm exec wrangler pages deploy "${GITHUB_WORKSPACE}/pages-candidate" \
            --cwd apps/web \
            --project-name "${SCRIBE_DROP_PRODUCTION_PAGES_PROJECT}" \
            --branch main \
            --commit-hash "${CANDIDATE_COMMIT_SHA}" \
            --commit-message "release candidate ${CANDIDATE_COMMIT_SHA}" \
            --commit-dirty=false \
            --no-bundle
          pnpm run cloudflare:secrets:verify:production
          pnpm run cloudflare:readback:production

      - name: Drain old provider before changing new-attempt selection
        if: ${{ !inputs.preflight_only }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm run production:provider:drain:verify

      - name: Select Cloud Run while keeping admission paused
        if: ${{ !inputs.preflight_only }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_PAGES_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
          SCRIBE_DROP_PRODUCTION_GPU_EXECUTION_ADMISSION: paused
          SCRIBE_DROP_PRODUCTION_GPU_EXECUTION_POLICY: cloud_run_jobs_l4_v1
        run: |
          pnpm run cloudflare:config:production:orchestrator
          pnpm exec wrangler deploy "${RELEASE_CANDIDATE_DIRECTORY}/orchestrator/index.js" \
            --no-bundle \
            --strict \
            --tag "candidate-${CANDIDATE_COMMIT_SHA}" \
            --message "release candidate ${CANDIDATE_COMMIT_SHA}" \
            --config .wrangler/deploy/orchestrator-production.toml \
            --env production
          pnpm run cloudflare:readback:production

      - name: Verify exact-one L4 authorization and activate admission
        if: ${{ !inputs.preflight_only }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_PAGES_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
          GOOGLE_OAUTH_ACCESS_TOKEN: ${{ steps.google-auth.outputs.access_token }}
          SCRIBE_DROP_PRODUCTION_GPU_EXECUTION_ADMISSION: active
          SCRIBE_DROP_PRODUCTION_GPU_EXECUTION_POLICY: cloud_run_jobs_l4_v1
        run: |
          pnpm run cloud-run:controller:deploy read production smoke \
            "${CLOUD_RUN_CANDIDATE_EVIDENCE_PATH}"
          pnpm run cloudflare:config:production:orchestrator
          pnpm exec wrangler deploy "${RELEASE_CANDIDATE_DIRECTORY}/orchestrator/index.js" \
            --no-bundle \
            --strict \
            --tag "candidate-${CANDIDATE_COMMIT_SHA}" \
            --message "release candidate ${CANDIDATE_COMMIT_SHA}" \
            --config .wrangler/deploy/orchestrator-production.toml \
            --env production
          pnpm run cloudflare:readback:production

      - name: Record immutable cutover evidence
        if: ${{ !inputs.preflight_only }}
        env:
          PRODUCTION_OPERATION: cutover
          STAGING_RUN_ID: ${{ inputs.staging_run_id }}
        run: |
          pnpm run production:cutover:evidence create production-cutover
          EXPECTED_CUTOVER_RUN_ID="${GITHUB_RUN_ID}" \
            EXPECTED_STAGING_RUN_ID="${STAGING_RUN_ID}" \
            pnpm run production:cutover:evidence verify production-cutover

      - name: Upload immutable cutover evidence
        if: ${{ !inputs.preflight_only }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scribe-drop-production-cutover-${{ inputs.candidate_commit_sha }}-${{ github.run_id }}
          path: production-cutover
          if-no-files-found: error
          retention-days: 7

  finalize:
    name: Verify production smoke and open the reviewed operating window
    if: inputs.operation == 'finalize'
    needs: verify-promotion
    environment: production
    permissions:
      actions: read
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      AUDIT_RETENTION_DAYS: ${{ vars.AUDIT_RETENTION_DAYS }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CANDIDATE_COMMIT_SHA: ${{ inputs.candidate_commit_sha }}
      EXPECTED_COMMIT_SHA: ${{ inputs.candidate_commit_sha }}
      EXPECTED_RELEASE_BRANCH: ${{ github.ref_name }}
      MULTIPART_RETENTION_HOURS: ${{ vars.MULTIPART_RETENTION_HOURS }}
      RELEASE_CANDIDATE_DIRECTORY: ${{ github.workspace }}/release-candidate
      RESULT_RETENTION_DAYS: ${{ vars.RESULT_RETENTION_DAYS }}
      SCRIBE_DROP_CANDIDATE_MIGRATIONS_DIR: ../../release-candidate/migrations
      SCRIBE_DROP_PRODUCTION_ACCESS_AUDIENCE: ${{ vars.SCRIBE_DROP_PRODUCTION_ACCESS_AUDIENCE }}
      SCRIBE_DROP_PRODUCTION_ACCESS_TEAM_DOMAIN: ${{ vars.SCRIBE_DROP_PRODUCTION_ACCESS_TEAM_DOMAIN }}
      SCRIBE_DROP_PRODUCTION_CLOUD_RUN_CONTROLLER_HMAC_SECRET_VERSION: ${{ vars.SCRIBE_DROP_PRODUCTION_CLOUD_RUN_CONTROLLER_HMAC_SECRET_VERSION }}
      SCRIBE_DROP_PRODUCTION_CLOUD_RUN_RUNTIME_MODE: active
      SCRIBE_DROP_PRODUCTION_CLOUD_RUN_RUNTIME_SERVICE_ACCOUNT: gpu-runtime-production@scribe-drop.iam.gserviceaccount.com
      SCRIBE_DROP_PRODUCTION_D1_DATABASE_ID: ${{ vars.SCRIBE_DROP_PRODUCTION_D1_DATABASE_ID }}
      SCRIBE_DROP_PRODUCTION_GPU_EXECUTION_POLICY: cloud_run_jobs_l4_v1
      SCRIBE_DROP_PRODUCTION_ORCHESTRATOR_ORIGIN: ${{ vars.SCRIBE_DROP_PRODUCTION_ORCHESTRATOR_ORIGIN }}
      SCRIBE_DROP_PRODUCTION_PAGES_PROJECT: ${{ vars.SCRIBE_DROP_PRODUCTION_PAGES_PROJECT }}
      SCRIBE_DROP_PRODUCTION_RUNPOD_GPU_IDS: ${{ vars.SCRIBE_DROP_PRODUCTION_RUNPOD_GPU_IDS }}
      SCRIBE_DROP_PRODUCTION_RUNPOD_IMAGE_VISIBILITY: ${{ vars.SCRIBE_DROP_PRODUCTION_RUNPOD_IMAGE_VISIBILITY }}
      SCRIBE_DROP_PRODUCTION_RUNPOD_REGISTRY_AUTH_ID: ${{ vars.SCRIBE_DROP_PRODUCTION_RUNPOD_REGISTRY_AUTH_ID }}
      SCRIBE_DROP_PRODUCTION_WEB_ORIGIN: ${{ vars.SCRIBE_DROP_PRODUCTION_WEB_ORIGIN }}
      SOURCE_RETENTION_DAYS: ${{ vars.SOURCE_RETENTION_DAYS }}
    steps:
      - name: Check out release commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Volta
        uses: volta-cli/action@615a78f6c83e116339c53b94f3f82b4d6c0b7d18 # v5.0.0
        with:
          volta-version: 2.0.2

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Authenticate isolated production deployer
        id: google-auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: projects/601035271372/locations/global/workloadIdentityPools/scribe-drop-release/providers/github-production-deployment
          service_account: sd-production-deployer@scribe-drop.iam.gserviceaccount.com
          project_id: scribe-drop
          token_format: access_token
          access_token_lifetime: 3600s

      - name: Set up pinned Google Cloud CLI
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          version: 579.0.0
          project_id: scribe-drop

      - name: Download acceptance and export finalized candidate identity
        env:
          GH_TOKEN: ${{ github.token }}
          STAGING_RUN_ID: ${{ inputs.staging_run_id }}
        run: |
          printf 'EXPECTED_RELEASE_VERSION=%s\n' "$(node -p "require('./package.json').version")" >>"${GITHUB_ENV}"
          printf 'SCRIBE_DROP_PRODUCTION_R2_HOST=%s.r2.cloudflarestorage.com\n' "${CLOUDFLARE_ACCOUNT_ID}" >>"${GITHUB_ENV}"
          gh run download "${STAGING_RUN_ID}" \
            --name "scribe-drop-staging-acceptance-${CANDIDATE_COMMIT_SHA}" \
            --dir staging-acceptance
          node scripts/export-staging-acceptance-identity.mjs staging-acceptance

      - name: Download immutable candidates and cutover evidence
        env:
          CUTOVER_RUN_ID: ${{ inputs.cutover_run_id }}
          GH_TOKEN: ${{ github.token }}
          STAGING_RUN_ID: ${{ inputs.staging_run_id }}
        run: |
          gh run download "${CANDIDATE_RUN_ID}" \
            --name "scribe-drop-release-candidate-${CANDIDATE_COMMIT_SHA}" \
            --dir "${RELEASE_CANDIDATE_DIRECTORY}"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${CLOUD_RUN_CANDIDATE_RUN_ID}" \
            >"${RUNNER_TEMP}/cloud-run-candidate-run.json"
          cloud_run_attempt="$(node -p "JSON.parse(require('node:fs').readFileSync(process.argv[1], 'utf8')).run_attempt" "${RUNNER_TEMP}/cloud-run-candidate-run.json")"
          gh run download "${CLOUD_RUN_CANDIDATE_RUN_ID}" \
            --name "scribe-drop-cloud-run-candidate-${CANDIDATE_COMMIT_SHA}-${CLOUD_RUN_CANDIDATE_RUN_ID}-${cloud_run_attempt}" \
            --dir cloud-run-candidate
          printf 'CLOUD_RUN_CANDIDATE_EVIDENCE_PATH=%s\n' \
            "${GITHUB_WORKSPACE}/cloud-run-candidate/cloud-run-candidate.json" >>"${GITHUB_ENV}"
          gh run download "${CUTOVER_RUN_ID}" \
            --name "scribe-drop-production-cutover-${CANDIDATE_COMMIT_SHA}-${CUTOVER_RUN_ID}" \
            --dir production-cutover
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${CUTOVER_RUN_ID}" \
            >"${RUNNER_TEMP}/cutover-run.json"
          printf 'CUTOVER_RUN_PATH=%s\n' "${RUNNER_TEMP}/cutover-run.json" >>"${GITHUB_ENV}"
          EXPECTED_CUTOVER_RUN_ID="${CUTOVER_RUN_ID}" \
            pnpm run production:cutover:evidence verify production-cutover
          pnpm run candidate:verify "${RELEASE_CANDIDATE_DIRECTORY}"
          pnpm run cloud-run:candidate:evidence verify cloud-run-candidate/cloud-run-candidate.json

      - name: Build verifier and reconstruct exact active production configuration
        env:
          GOOGLE_OAUTH_ACCESS_TOKEN: ${{ steps.google-auth.outputs.access_token }}
          SCRIBE_DROP_CLOUD_RUN_EXPECTED_AUTHORIZATION_EPOCH: phase16-smoke-${{ inputs.candidate_commit_sha }}-${{ inputs.cutover_run_id }}
          SCRIBE_DROP_CLOUD_RUN_EXPECTED_RESERVED_EXECUTIONS: "1"
        run: |
          pnpm run workflow:build:gpu-controller
          pnpm run cloud-run:controller:deploy preflight production disabled \
            "${CLOUD_RUN_CANDIDATE_EVIDENCE_PATH}"
          pnpm run runpod:config:production
          pnpm run candidate:pages "${RELEASE_CANDIDATE_DIRECTORY}" pages-candidate
          SCRIBE_DROP_PRODUCTION_GPU_EXECUTION_ADMISSION=active \
            pnpm run cloud-run:production:origin:export

      - name: Verify production smoke and exact provider cleanup before mutation
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_PAGES_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
          GOOGLE_OAUTH_ACCESS_TOKEN: ${{ steps.google-auth.outputs.access_token }}
          SCRIBE_DROP_CLOUD_RUN_AUTHORIZATION_EPOCH: phase16-smoke-${{ inputs.candidate_commit_sha }}-${{ inputs.cutover_run_id }}
          SCRIBE_DROP_PRODUCTION_GPU_EXECUTION_ADMISSION: active
        run: |
          pnpm run cloudflare:config:production
          pnpm run cloudflare:readback:production
          pnpm run cloud-run:production:smoke:verify "${{ inputs.production_smoke_job_id }}"
          pnpm run cloud-run:acceptance:clean production "${CUTOVER_RUN_PATH}"

      - name: Pause admission and disable the consumed smoke authorization
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_PAGES_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
          GOOGLE_OAUTH_ACCESS_TOKEN: ${{ steps.google-auth.outputs.access_token }}
          SCRIBE_DROP_CLOUD_RUN_EXPECTED_RESERVED_EXECUTIONS: "1"
          SCRIBE_DROP_PRODUCTION_GPU_EXECUTION_ADMISSION: paused
        run: |
          pnpm run cloudflare:config:production:orchestrator
          pnpm exec wrangler deploy "${RELEASE_CANDIDATE_DIRECTORY}/orchestrator/index.js" \
            --no-bundle \
            --strict \
            --tag "candidate-${CANDIDATE_COMMIT_SHA}" \
            --message "release candidate ${CANDIDATE_COMMIT_SHA}" \
            --config .wrangler/deploy/orchestrator-production.toml \
            --env production
          pnpm run cloudflare:readback:production
          pnpm run cloud-run:controller:deploy apply production disabled \
            "${CLOUD_RUN_CANDIDATE_EVIDENCE_PATH}"

      - name: Apply reviewed finite operating authorization and reactivate admission
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_PAGES_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
          GOOGLE_OAUTH_ACCESS_TOKEN: ${{ steps.google-auth.outputs.access_token }}
          SCRIBE_DROP_CLOUD_RUN_AUTHORIZATION_EPOCH: phase16-operational-${{ inputs.candidate_commit_sha }}-${{ github.run_id }}
          SCRIBE_DROP_CLOUD_RUN_AUTHORIZATION_VALID_UNTIL: ${{ inputs.operational_valid_until }}
          SCRIBE_DROP_CLOUD_RUN_MAX_EXECUTIONS: ${{ inputs.operational_max_executions }}
          SCRIBE_DROP_CLOUD_RUN_MAX_WORST_CASE_JPY: ${{ inputs.operational_max_worst_case_jpy }}
          SCRIBE_DROP_PRODUCTION_GPU_EXECUTION_ADMISSION: active
        run: |
          pnpm run cloud-run:controller:deploy apply production operational \
            "${CLOUD_RUN_CANDIDATE_EVIDENCE_PATH}"
          pnpm run cloudflare:config:production
          pnpm exec wrangler deploy "${RELEASE_CANDIDATE_DIRECTORY}/orchestrator/index.js" \
            --no-bundle \
            --strict \
            --tag "candidate-${CANDIDATE_COMMIT_SHA}" \
            --message "release candidate ${CANDIDATE_COMMIT_SHA}" \
            --config .wrangler/deploy/orchestrator-production.toml \
            --env production
          pnpm run cloudflare:readback:production
          pnpm run cloud-run:controller:deploy read production operational \
            "${CLOUD_RUN_CANDIDATE_EVIDENCE_PATH}"

      - name: Verify final parity, Access, and accepted artifact identity
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_PAGES_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
          EXPECTED_STAGING_RUN_ID: ${{ inputs.staging_run_id }}
          MINIMUM_ACCEPTANCE_REMAINING_SECONDS: "1800"
          SCRIBE_DROP_PRODUCTION_GPU_EXECUTION_ADMISSION: active
        run: |
          pnpm run environment:policy:export production
          EXPECTED_CANDIDATE_RUN_ID="${CANDIDATE_RUN_ID}" \
            EXPECTED_CLOUD_RUN_CANDIDATE_RUN_ID="${CLOUD_RUN_CANDIDATE_RUN_ID}" \
            pnpm run staging:acceptance:verify "${RELEASE_CANDIDATE_DIRECTORY}" staging-acceptance
          pnpm run cloudflare:access:verify:production
          pnpm run cloudflare:secrets:verify:production

      - name: Record immutable production release evidence
        env:
          CUTOVER_RUN_ID: ${{ inputs.cutover_run_id }}
          OPERATIONAL_MAX_EXECUTIONS: ${{ inputs.operational_max_executions }}
          OPERATIONAL_MAX_WORST_CASE_JPY: ${{ inputs.operational_max_worst_case_jpy }}
          OPERATIONAL_VALID_UNTIL: ${{ inputs.operational_valid_until }}
          PRODUCTION_SMOKE_JOB_ID: ${{ inputs.production_smoke_job_id }}
          STAGING_RUN_ID: ${{ inputs.staging_run_id }}
        run: pnpm run production:release:evidence create production-release

      - name: Upload immutable production release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scribe-drop-production-release-${{ inputs.candidate_commit_sha }}-${{ github.run_id }}
          path: production-release
          if-no-files-found: error
          retention-days: 90
