name: Deploy release candidate to staging

on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Successful release-candidate workflow run ID
        required: true
        type: string
      cloud_run_candidate_run_id:
        description: Successful Cloud Run candidate workflow run ID for the same commit
        required: true
        type: string

run-name: Deploy candidate from run ${{ inputs.candidate_run_id }} to staging

permissions:
  actions: read
  contents: read

concurrency:
  group: scribe-drop-staging-promotion
  cancel-in-progress: false

env:
  VOLTA_FEATURE_PNPM: "1"
  WRANGLER_WRITE_LOGS: "0"

jobs:
  preflight:
    name: Verify candidate and all remote prerequisites
    environment: staging
    permissions:
      actions: read
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AUDIT_RETENTION_DAYS: ${{ vars.AUDIT_RETENTION_DAYS }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      EXPECTED_COMMIT_SHA: ${{ github.sha }}
      EXPECTED_RELEASE_BRANCH: ${{ github.ref_name }}
      MULTIPART_RETENTION_HOURS: ${{ vars.MULTIPART_RETENTION_HOURS }}
      RELEASE_CANDIDATE_DIRECTORY: ${{ github.workspace }}/release-candidate
      RESULT_RETENTION_DAYS: ${{ vars.RESULT_RETENTION_DAYS }}
      SCRIBE_DROP_CANDIDATE_MIGRATIONS_DIR: ../../release-candidate/migrations
      SCRIBE_DROP_STAGING_ACCESS_AUDIENCE: ${{ vars.SCRIBE_DROP_STAGING_ACCESS_AUDIENCE }}
      SCRIBE_DROP_STAGING_ACCESS_TEAM_DOMAIN: ${{ vars.SCRIBE_DROP_STAGING_ACCESS_TEAM_DOMAIN }}
      SCRIBE_DROP_STAGING_D1_DATABASE_ID: ${{ vars.SCRIBE_DROP_STAGING_D1_DATABASE_ID }}
      SCRIBE_DROP_STAGING_CLOUD_RUN_CONTROLLER_ORIGIN: ${{ vars.SCRIBE_DROP_STAGING_CLOUD_RUN_CONTROLLER_ORIGIN }}
      SCRIBE_DROP_STAGING_CLOUD_RUN_CONTROLLER_HMAC_SECRET_VERSION: ${{ vars.SCRIBE_DROP_STAGING_CLOUD_RUN_CONTROLLER_HMAC_SECRET_VERSION }}
      SCRIBE_DROP_STAGING_CLOUD_RUN_RUNTIME_MODE: synthetic-shadow
      SCRIBE_DROP_STAGING_CLOUD_RUN_RUNTIME_SERVICE_ACCOUNT: ${{ vars.SCRIBE_DROP_STAGING_CLOUD_RUN_RUNTIME_SERVICE_ACCOUNT }}
      SCRIBE_DROP_STAGING_E2E_SERVICE_TOKEN_COMMON_NAME: ${{ vars.SCRIBE_DROP_STAGING_E2E_SERVICE_TOKEN_COMMON_NAME }}
      SCRIBE_DROP_STAGING_ORCHESTRATOR_ORIGIN: ${{ vars.SCRIBE_DROP_STAGING_ORCHESTRATOR_ORIGIN }}
      # This read-only job computes the final accepted parity identity. Actual
      # backend deployment stays on RunPod until the paid acceptance job.
      SCRIBE_DROP_STAGING_GPU_EXECUTION_POLICY: cloud_run_jobs_l4_v1
      SCRIBE_DROP_STAGING_GPU_EXECUTION_ADMISSION: active
      SCRIBE_DROP_STAGING_PAGES_ACCESS_AUDIENCE: ${{ vars.SCRIBE_DROP_STAGING_PAGES_ACCESS_AUDIENCE }}
      SCRIBE_DROP_STAGING_PAGES_PROJECT: ${{ vars.SCRIBE_DROP_STAGING_PAGES_PROJECT }}
      SCRIBE_DROP_STAGING_R2_HOST: ${{ vars.SCRIBE_DROP_STAGING_R2_HOST }}
      SCRIBE_DROP_STAGING_RUNPOD_GPU_IDS: ${{ vars.SCRIBE_DROP_STAGING_RUNPOD_GPU_IDS }}
      SCRIBE_DROP_STAGING_RUNPOD_IMAGE_VISIBILITY: ${{ vars.SCRIBE_DROP_STAGING_RUNPOD_IMAGE_VISIBILITY }}
      SCRIBE_DROP_STAGING_RUNPOD_REGISTRY_AUTH_ID: ${{ vars.SCRIBE_DROP_STAGING_RUNPOD_REGISTRY_AUTH_ID }}
      SCRIBE_DROP_STAGING_WEB_ORIGIN: ${{ vars.SCRIBE_DROP_STAGING_WEB_ORIGIN }}
      SOURCE_RETENTION_DAYS: ${{ vars.SOURCE_RETENTION_DAYS }}
    steps:
      - name: Check out release commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Volta
        uses: volta-cli/action@615a78f6c83e116339c53b94f3f82b4d6c0b7d18 # v5.0.0
        with:
          volta-version: 2.0.2

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Authenticate and read back the isolated staging deployment identity
        id: google-auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: projects/601035271372/locations/global/workloadIdentityPools/scribe-drop-release/providers/github-staging-deployment
          service_account: sd-staging-deployer@scribe-drop.iam.gserviceaccount.com
          project_id: scribe-drop
          token_format: access_token
          access_token_lifetime: 900s

      - name: Set up pinned Google Cloud CLI for foundation preflight
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          version: 579.0.0
          project_id: scribe-drop

      - name: Verify staging deployment foundation before candidate mutation
        run: pnpm run cloud-run:foundation:read staging

      - name: Verify exact staging release inputs before candidate mutation
        env:
          GOOGLE_OAUTH_ACCESS_TOKEN: ${{ steps.google-auth.outputs.access_token }}
        run: pnpm run cloud-run:staging:inputs:verify

      - name: Verify both staging Access applications before remote work
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm run cloudflare:access:control-plane:verify:staging

      - name: Verify staging Pages upload permission before remote work
        env:
          CLOUDFLARE_PAGES_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
        run: pnpm run cloudflare:pages:upload-permission:verify:staging

      - name: Verify staging service authentication before remote work
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: pnpm run cloudflare:access:service:verify:staging

      - name: Install checksummed RunPod CLI
        run: pnpm run runpodctl:install

      - name: Validate release and candidate run identities
        env:
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          CLOUD_RUN_CANDIDATE_RUN_ID: ${{ inputs.cloud_run_candidate_run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          case "${GITHUB_REF}" in
            refs/heads/release/*)
              release_version="${GITHUB_REF#refs/heads/release/}"
              ;;
            *)
              echo "Staging accepts candidates only from release branches" >&2
              exit 1
              ;;
          esac
          if ! printf '%s' "${CANDIDATE_RUN_ID}" | grep -Eq '^[1-9][0-9]*$'; then
            echo "Candidate run ID is invalid" >&2
            exit 1
          fi
          if ! printf '%s' "${CLOUD_RUN_CANDIDATE_RUN_ID}" | grep -Eq '^[1-9][0-9]*$'; then
            echo "Cloud Run candidate run ID is invalid" >&2
            exit 1
          fi
          if [ "${release_version}" != "$(node -p "require('./package.json').version")" ]; then
            echo "Release branch and package version must match" >&2
            exit 1
          fi
          printf 'EXPECTED_RELEASE_VERSION=%s\n' "${release_version}" >>"${GITHUB_ENV}"
          gh api \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${CANDIDATE_RUN_ID}" \
            >"${RUNNER_TEMP}/candidate-run.json"
          node scripts/verify-workflow-run.mjs \
            "${RUNNER_TEMP}/candidate-run.json" \
            .github/workflows/publish-runpod-worker.yml \
            "${CANDIDATE_RUN_ID}"
          gh api \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${CLOUD_RUN_CANDIDATE_RUN_ID}" \
            >"${RUNNER_TEMP}/cloud-run-candidate-run.json"
          node scripts/verify-workflow-run.mjs \
            "${RUNNER_TEMP}/cloud-run-candidate-run.json" \
            .github/workflows/publish-cloud-run-candidate.yml \
            "${CLOUD_RUN_CANDIDATE_RUN_ID}"
          gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-staging-candidate.yml/runs?event=workflow_dispatch&head_sha=${GITHUB_SHA}&per_page=100" \
            >"${RUNNER_TEMP}/staging-workflow-runs.json"
          pnpm run staging:dispatch:verify "${RUNNER_TEMP}/staging-workflow-runs.json"
          cloud_run_attempt="$(node -p "JSON.parse(require('node:fs').readFileSync(process.argv[1], 'utf8')).run_attempt" "${RUNNER_TEMP}/cloud-run-candidate-run.json")"
          printf 'CLOUD_RUN_CANDIDATE_RUN_ATTEMPT=%s\n' "${cloud_run_attempt}" >>"${GITHUB_ENV}"

      - name: Download and verify immutable release candidate
        env:
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "${CANDIDATE_RUN_ID}" \
            --name "scribe-drop-release-candidate-${GITHUB_SHA}" \
            --dir "${RELEASE_CANDIDATE_DIRECTORY}"
          pnpm run candidate:verify "${RELEASE_CANDIDATE_DIRECTORY}"

      - name: Download and verify immutable Cloud Run candidate
        env:
          CLOUD_RUN_CANDIDATE_RUN_ID: ${{ inputs.cloud_run_candidate_run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "${CLOUD_RUN_CANDIDATE_RUN_ID}" \
            --name "scribe-drop-cloud-run-candidate-${GITHUB_SHA}-${CLOUD_RUN_CANDIDATE_RUN_ID}-${CLOUD_RUN_CANDIDATE_RUN_ATTEMPT}" \
            --dir cloud-run-candidate
          pnpm run cloud-run:candidate:evidence verify cloud-run-candidate/cloud-run-candidate.json
          printf 'CLOUD_RUN_CANDIDATE_EVIDENCE_PATH=%s\n' \
            "${GITHUB_WORKSPACE}/cloud-run-candidate/cloud-run-candidate.json" >>"${GITHUB_ENV}"

      - name: Verify the real staging E2E fixture before any mutation
        run: pnpm run staging:e2e:fixture:verify

      - name: Assemble verified Pages advanced-mode output
        run: pnpm run candidate:pages "${RELEASE_CANDIDATE_DIRECTORY}" pages-candidate

      - name: Render environment-only staging configuration
        run: |
          pnpm run cloudflare:config:staging
          pnpm run runpod:config:staging

      - name: Verify Worker route capability before any mutation
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm run cloudflare:worker-route:verify:staging

      - name: Export normalized staging environment policy
        run: pnpm run environment:policy:export staging

      - name: Verify existing encrypted secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_PAGES_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
          SCRIBE_DROP_PAGES_PROJECT: ${{ vars.SCRIBE_DROP_STAGING_PAGES_PROJECT }}
        run: pnpm run cloudflare:secrets:verify:staging

      - name: Verify the staging Access boundary
        run: pnpm run cloudflare:access:verify:staging

      - name: Verify Pages deploy configuration and target
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
        run: |
          pnpm exec wrangler pages deployment list \
            --cwd apps/web \
            --project-name "${SCRIBE_DROP_STAGING_PAGES_PROJECT}" \
            --environment production \
            --json >"${RUNNER_TEMP}/pages-deployment-preflight.json"
          test -s "${RUNNER_TEMP}/pages-deployment-preflight.json"

      - name: Verify RunPod control plane before any mutation
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          SCRIBE_DROP_STAGING_RUNPOD_ENDPOINT_ID: ${{ secrets.SCRIBE_DROP_STAGING_RUNPOD_ENDPOINT_ID }}
        run: pnpm run runpod:preflight:staging

  migrate:
    name: Apply candidate D1 migrations
    needs: preflight
    environment: staging
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AUDIT_RETENTION_DAYS: ${{ vars.AUDIT_RETENTION_DAYS }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      EXPECTED_COMMIT_SHA: ${{ github.sha }}
      MULTIPART_RETENTION_HOURS: ${{ vars.MULTIPART_RETENTION_HOURS }}
      RELEASE_CANDIDATE_DIRECTORY: ${{ github.workspace }}/release-candidate
      RESULT_RETENTION_DAYS: ${{ vars.RESULT_RETENTION_DAYS }}
      SCRIBE_DROP_CANDIDATE_MIGRATIONS_DIR: ../../release-candidate/migrations
      SCRIBE_DROP_STAGING_D1_DATABASE_ID: ${{ vars.SCRIBE_DROP_STAGING_D1_DATABASE_ID }}
      SCRIBE_DROP_STAGING_CLOUD_RUN_CONTROLLER_ORIGIN: ${{ vars.SCRIBE_DROP_STAGING_CLOUD_RUN_CONTROLLER_ORIGIN }}
      SCRIBE_DROP_STAGING_CLOUD_RUN_RUNTIME_MODE: synthetic-shadow
      SCRIBE_DROP_STAGING_CLOUD_RUN_RUNTIME_SERVICE_ACCOUNT: ${{ vars.SCRIBE_DROP_STAGING_CLOUD_RUN_RUNTIME_SERVICE_ACCOUNT }}
      SCRIBE_DROP_STAGING_ORCHESTRATOR_ORIGIN: ${{ vars.SCRIBE_DROP_STAGING_ORCHESTRATOR_ORIGIN }}
      SCRIBE_DROP_STAGING_GPU_EXECUTION_POLICY: runpod_serverless_v1
      SCRIBE_DROP_STAGING_GPU_EXECUTION_ADMISSION: active
      SCRIBE_DROP_STAGING_RUNPOD_GPU_IDS: ${{ vars.SCRIBE_DROP_STAGING_RUNPOD_GPU_IDS }}
      SCRIBE_DROP_STAGING_WEB_ORIGIN: ${{ vars.SCRIBE_DROP_STAGING_WEB_ORIGIN }}
      SOURCE_RETENTION_DAYS: ${{ vars.SOURCE_RETENTION_DAYS }}
    steps:
      - name: Check out release commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Volta
        uses: volta-cli/action@615a78f6c83e116339c53b94f3f82b4d6c0b7d18 # v5.0.0
        with:
          volta-version: 2.0.2

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Export release version
        run: printf 'EXPECTED_RELEASE_VERSION=%s\n' "$(node -p "require('./package.json').version")" >>"${GITHUB_ENV}"

      - name: Download and verify immutable release candidate
        env:
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "${CANDIDATE_RUN_ID}" \
            --name "scribe-drop-release-candidate-${GITHUB_SHA}" \
            --dir "${RELEASE_CANDIDATE_DIRECTORY}"
          pnpm run candidate:verify "${RELEASE_CANDIDATE_DIRECTORY}"

      - name: Render migration deployment configuration
        run: pnpm run cloudflare:config:staging:orchestrator

      - name: Apply candidate D1 migrations exactly once
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          pnpm exec wrangler d1 migrations apply SCRIBE_DROP_DB \
            --remote \
            --config .wrangler/deploy/orchestrator-staging.toml \
            --env staging

  deploy-pages:
    name: Promote exact candidate Pages deployment
    needs: migrate
    environment: staging
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      EXPECTED_COMMIT_SHA: ${{ github.sha }}
      RELEASE_CANDIDATE_DIRECTORY: ${{ github.workspace }}/release-candidate
      SCRIBE_DROP_STAGING_ACCESS_AUDIENCE: ${{ vars.SCRIBE_DROP_STAGING_ACCESS_AUDIENCE }}
      SCRIBE_DROP_STAGING_ACCESS_TEAM_DOMAIN: ${{ vars.SCRIBE_DROP_STAGING_ACCESS_TEAM_DOMAIN }}
      SCRIBE_DROP_STAGING_D1_DATABASE_ID: ${{ vars.SCRIBE_DROP_STAGING_D1_DATABASE_ID }}
      SCRIBE_DROP_STAGING_CLOUD_RUN_CONTROLLER_ORIGIN: ${{ vars.SCRIBE_DROP_STAGING_CLOUD_RUN_CONTROLLER_ORIGIN }}
      SCRIBE_DROP_STAGING_CLOUD_RUN_RUNTIME_MODE: synthetic-shadow
      SCRIBE_DROP_STAGING_CLOUD_RUN_RUNTIME_SERVICE_ACCOUNT: ${{ vars.SCRIBE_DROP_STAGING_CLOUD_RUN_RUNTIME_SERVICE_ACCOUNT }}
      SCRIBE_DROP_STAGING_E2E_SERVICE_TOKEN_COMMON_NAME: ${{ vars.SCRIBE_DROP_STAGING_E2E_SERVICE_TOKEN_COMMON_NAME }}
      SCRIBE_DROP_STAGING_PAGES_ACCESS_AUDIENCE: ${{ vars.SCRIBE_DROP_STAGING_PAGES_ACCESS_AUDIENCE }}
      SCRIBE_DROP_STAGING_PAGES_PROJECT: ${{ vars.SCRIBE_DROP_STAGING_PAGES_PROJECT }}
      SCRIBE_DROP_STAGING_WEB_ORIGIN: ${{ vars.SCRIBE_DROP_STAGING_WEB_ORIGIN }}
    steps:
      - name: Check out release commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Volta
        uses: volta-cli/action@615a78f6c83e116339c53b94f3f82b4d6c0b7d18 # v5.0.0
        with:
          volta-version: 2.0.2

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Export release version
        run: printf 'EXPECTED_RELEASE_VERSION=%s\n' "$(node -p "require('./package.json').version")" >>"${GITHUB_ENV}"

      - name: Download and verify immutable release candidate
        env:
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "${CANDIDATE_RUN_ID}" \
            --name "scribe-drop-release-candidate-${GITHUB_SHA}" \
            --dir "${RELEASE_CANDIDATE_DIRECTORY}"
          pnpm run candidate:verify "${RELEASE_CANDIDATE_DIRECTORY}"

      - name: Assemble verified Pages advanced-mode output
        run: pnpm run candidate:pages "${RELEASE_CANDIDATE_DIRECTORY}" pages-candidate

      - name: Render Pages deployment configuration
        run: pnpm run cloudflare:config:staging:web

      - name: Promote Pages candidate with exact read-back
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
        run: pnpm run cloudflare:pages:promote:staging pages-candidate

  deploy-backend:
    name: Promote R2, RunPod, and Orchestrator
    needs: deploy-pages
    environment: staging
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AUDIT_RETENTION_DAYS: ${{ vars.AUDIT_RETENTION_DAYS }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      EXPECTED_COMMIT_SHA: ${{ github.sha }}
      MULTIPART_RETENTION_HOURS: ${{ vars.MULTIPART_RETENTION_HOURS }}
      RELEASE_CANDIDATE_DIRECTORY: ${{ github.workspace }}/release-candidate
      RESULT_RETENTION_DAYS: ${{ vars.RESULT_RETENTION_DAYS }}
      SCRIBE_DROP_CANDIDATE_MIGRATIONS_DIR: ../../release-candidate/migrations
      SCRIBE_DROP_STAGING_ACCESS_AUDIENCE: ${{ vars.SCRIBE_DROP_STAGING_ACCESS_AUDIENCE }}
      SCRIBE_DROP_STAGING_ACCESS_TEAM_DOMAIN: ${{ vars.SCRIBE_DROP_STAGING_ACCESS_TEAM_DOMAIN }}
      SCRIBE_DROP_STAGING_D1_DATABASE_ID: ${{ vars.SCRIBE_DROP_STAGING_D1_DATABASE_ID }}
      SCRIBE_DROP_STAGING_CLOUD_RUN_CONTROLLER_ORIGIN: ${{ vars.SCRIBE_DROP_STAGING_CLOUD_RUN_CONTROLLER_ORIGIN }}
      SCRIBE_DROP_STAGING_CLOUD_RUN_RUNTIME_MODE: synthetic-shadow
      SCRIBE_DROP_STAGING_CLOUD_RUN_RUNTIME_SERVICE_ACCOUNT: ${{ vars.SCRIBE_DROP_STAGING_CLOUD_RUN_RUNTIME_SERVICE_ACCOUNT }}
      SCRIBE_DROP_STAGING_E2E_SERVICE_TOKEN_COMMON_NAME: ${{ vars.SCRIBE_DROP_STAGING_E2E_SERVICE_TOKEN_COMMON_NAME }}
      SCRIBE_DROP_STAGING_ORCHESTRATOR_ORIGIN: ${{ vars.SCRIBE_DROP_STAGING_ORCHESTRATOR_ORIGIN }}
      SCRIBE_DROP_STAGING_GPU_EXECUTION_POLICY: runpod_serverless_v1
      SCRIBE_DROP_STAGING_GPU_EXECUTION_ADMISSION: active
      SCRIBE_DROP_STAGING_PAGES_ACCESS_AUDIENCE: ${{ vars.SCRIBE_DROP_STAGING_PAGES_ACCESS_AUDIENCE }}
      SCRIBE_DROP_STAGING_PAGES_PROJECT: ${{ vars.SCRIBE_DROP_STAGING_PAGES_PROJECT }}
      SCRIBE_DROP_STAGING_RUNPOD_GPU_IDS: ${{ vars.SCRIBE_DROP_STAGING_RUNPOD_GPU_IDS }}
      SCRIBE_DROP_STAGING_RUNPOD_IMAGE_VISIBILITY: ${{ vars.SCRIBE_DROP_STAGING_RUNPOD_IMAGE_VISIBILITY }}
      SCRIBE_DROP_STAGING_RUNPOD_REGISTRY_AUTH_ID: ${{ vars.SCRIBE_DROP_STAGING_RUNPOD_REGISTRY_AUTH_ID }}
      SCRIBE_DROP_STAGING_WEB_ORIGIN: ${{ vars.SCRIBE_DROP_STAGING_WEB_ORIGIN }}
      SOURCE_RETENTION_DAYS: ${{ vars.SOURCE_RETENTION_DAYS }}
    steps:
      - name: Check out release commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Volta
        uses: volta-cli/action@615a78f6c83e116339c53b94f3f82b4d6c0b7d18 # v5.0.0
        with:
          volta-version: 2.0.2

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Install checksummed RunPod CLI
        run: pnpm run runpodctl:install

      - name: Export release version
        run: printf 'EXPECTED_RELEASE_VERSION=%s\n' "$(node -p "require('./package.json').version")" >>"${GITHUB_ENV}"

      - name: Download and verify immutable release candidate
        env:
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "${CANDIDATE_RUN_ID}" \
            --name "scribe-drop-release-candidate-${GITHUB_SHA}" \
            --dir "${RELEASE_CANDIDATE_DIRECTORY}"
          pnpm run candidate:verify "${RELEASE_CANDIDATE_DIRECTORY}"

      - name: Render backend deployment configuration
        run: |
          pnpm run cloudflare:config:staging
          pnpm run runpod:config:staging

      - name: Apply reviewed R2 browser and retention policies
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          pnpm exec wrangler r2 bucket cors set recording-transcriber-staging \
            --file .wrangler/deploy/r2-cors-staging.json \
            --config .wrangler/deploy/orchestrator-staging.toml \
            --env staging \
            --force
          pnpm exec wrangler r2 bucket lifecycle set recording-transcriber-staging \
            --file .wrangler/deploy/r2-lifecycle-staging.json \
            --config .wrangler/deploy/orchestrator-staging.toml \
            --env staging \
            --force

      - name: Promote the candidate RunPod image
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          SCRIBE_DROP_STAGING_RUNPOD_ENDPOINT_ID: ${{ secrets.SCRIBE_DROP_STAGING_RUNPOD_ENDPOINT_ID }}
        run: pnpm run runpod:promote:staging

      - name: Deploy exact candidate Orchestrator bundle
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          pnpm exec wrangler deploy "${RELEASE_CANDIDATE_DIRECTORY}/orchestrator/index.js" \
            --no-bundle \
            --strict \
            --tag "candidate-${GITHUB_SHA}" \
            --message "release candidate ${GITHUB_SHA}" \
            --config .wrangler/deploy/orchestrator-staging.toml \
            --env staging

  acceptance:
    name: Verify live resources and run real staging acceptance
    needs: deploy-backend
    environment: staging
    permissions:
      actions: read
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      AUDIT_RETENTION_DAYS: ${{ vars.AUDIT_RETENTION_DAYS }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      EXPECTED_COMMIT_SHA: ${{ github.sha }}
      MULTIPART_RETENTION_HOURS: ${{ vars.MULTIPART_RETENTION_HOURS }}
      RELEASE_CANDIDATE_DIRECTORY: ${{ github.workspace }}/release-candidate
      RESULT_RETENTION_DAYS: ${{ vars.RESULT_RETENTION_DAYS }}
      SCRIBE_DROP_CANDIDATE_MIGRATIONS_DIR: ../../release-candidate/migrations
      SCRIBE_DROP_STAGING_ACCESS_AUDIENCE: ${{ vars.SCRIBE_DROP_STAGING_ACCESS_AUDIENCE }}
      SCRIBE_DROP_STAGING_ACCESS_TEAM_DOMAIN: ${{ vars.SCRIBE_DROP_STAGING_ACCESS_TEAM_DOMAIN }}
      SCRIBE_DROP_STAGING_D1_DATABASE_ID: ${{ vars.SCRIBE_DROP_STAGING_D1_DATABASE_ID }}
      SCRIBE_DROP_STAGING_CLOUD_RUN_CONTROLLER_ORIGIN: ${{ vars.SCRIBE_DROP_STAGING_CLOUD_RUN_CONTROLLER_ORIGIN }}
      SCRIBE_DROP_STAGING_CLOUD_RUN_CONTROLLER_HMAC_SECRET_VERSION: ${{ vars.SCRIBE_DROP_STAGING_CLOUD_RUN_CONTROLLER_HMAC_SECRET_VERSION }}
      SCRIBE_DROP_STAGING_CLOUD_RUN_RUNTIME_MODE: synthetic-shadow
      SCRIBE_DROP_STAGING_CLOUD_RUN_RUNTIME_SERVICE_ACCOUNT: ${{ vars.SCRIBE_DROP_STAGING_CLOUD_RUN_RUNTIME_SERVICE_ACCOUNT }}
      SCRIBE_DROP_STAGING_E2E_SERVICE_TOKEN_COMMON_NAME: ${{ vars.SCRIBE_DROP_STAGING_E2E_SERVICE_TOKEN_COMMON_NAME }}
      SCRIBE_DROP_STAGING_ORCHESTRATOR_ORIGIN: ${{ vars.SCRIBE_DROP_STAGING_ORCHESTRATOR_ORIGIN }}
      SCRIBE_DROP_STAGING_GPU_EXECUTION_POLICY: cloud_run_jobs_l4_v1
      SCRIBE_DROP_STAGING_GPU_EXECUTION_ADMISSION: active
      SCRIBE_DROP_STAGING_PAGES_ACCESS_AUDIENCE: ${{ vars.SCRIBE_DROP_STAGING_PAGES_ACCESS_AUDIENCE }}
      SCRIBE_DROP_STAGING_PAGES_PROJECT: ${{ vars.SCRIBE_DROP_STAGING_PAGES_PROJECT }}
      SCRIBE_DROP_STAGING_R2_HOST: ${{ vars.SCRIBE_DROP_STAGING_R2_HOST }}
      SCRIBE_DROP_STAGING_RUNPOD_GPU_IDS: ${{ vars.SCRIBE_DROP_STAGING_RUNPOD_GPU_IDS }}
      SCRIBE_DROP_STAGING_RUNPOD_IMAGE_VISIBILITY: ${{ vars.SCRIBE_DROP_STAGING_RUNPOD_IMAGE_VISIBILITY }}
      SCRIBE_DROP_STAGING_RUNPOD_REGISTRY_AUTH_ID: ${{ vars.SCRIBE_DROP_STAGING_RUNPOD_REGISTRY_AUTH_ID }}
      SCRIBE_DROP_STAGING_WEB_ORIGIN: ${{ vars.SCRIBE_DROP_STAGING_WEB_ORIGIN }}
      SOURCE_RETENTION_DAYS: ${{ vars.SOURCE_RETENTION_DAYS }}
    steps:
      - name: Check out release commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Volta
        uses: volta-cli/action@615a78f6c83e116339c53b94f3f82b4d6c0b7d18 # v5.0.0
        with:
          volta-version: 2.0.2

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Authenticate the isolated staging deployer
        id: google-auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: projects/601035271372/locations/global/workloadIdentityPools/scribe-drop-release/providers/github-staging-deployment
          service_account: sd-staging-deployer@scribe-drop.iam.gserviceaccount.com
          project_id: scribe-drop
          token_format: access_token
          access_token_lifetime: 3600s

      - name: Set up pinned Google Cloud CLI
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          version: 579.0.0
          project_id: scribe-drop

      - name: Export release version
        run: printf 'EXPECTED_RELEASE_VERSION=%s\n' "$(node -p "require('./package.json').version")" >>"${GITHUB_ENV}"

      - name: Download and verify immutable release candidate
        env:
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "${CANDIDATE_RUN_ID}" \
            --name "scribe-drop-release-candidate-${GITHUB_SHA}" \
            --dir "${RELEASE_CANDIDATE_DIRECTORY}"
          pnpm run candidate:verify "${RELEASE_CANDIDATE_DIRECTORY}"

      - name: Download and verify the accepted Cloud Run candidate
        env:
          CLOUD_RUN_CANDIDATE_RUN_ID: ${{ inputs.cloud_run_candidate_run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${CLOUD_RUN_CANDIDATE_RUN_ID}" \
            >"${RUNNER_TEMP}/cloud-run-candidate-run.json"
          node scripts/verify-workflow-run.mjs \
            "${RUNNER_TEMP}/cloud-run-candidate-run.json" \
            .github/workflows/publish-cloud-run-candidate.yml \
            "${CLOUD_RUN_CANDIDATE_RUN_ID}"
          cloud_run_attempt="$(node -p "JSON.parse(require('node:fs').readFileSync(process.argv[1], 'utf8')).run_attempt" "${RUNNER_TEMP}/cloud-run-candidate-run.json")"
          gh run download "${CLOUD_RUN_CANDIDATE_RUN_ID}" \
            --name "scribe-drop-cloud-run-candidate-${GITHUB_SHA}-${CLOUD_RUN_CANDIDATE_RUN_ID}-${cloud_run_attempt}" \
            --dir cloud-run-candidate
          pnpm run cloud-run:candidate:evidence verify cloud-run-candidate/cloud-run-candidate.json
          printf 'CLOUD_RUN_CANDIDATE_EVIDENCE_PATH=%s\n' \
            "${GITHUB_WORKSPACE}/cloud-run-candidate/cloud-run-candidate.json" >>"${GITHUB_ENV}"

      - name: Install checksummed RunPod CLI
        run: pnpm run runpodctl:install

      - name: Build the controller deployment verifier
        run: pnpm --filter @scribe-drop/gpu-controller build

      - name: Install fixed Playwright browser before controller mutation
        run: pnpm --filter @scribe-drop/e2e exec playwright install --with-deps chromium

      - name: Pause staging admission before bounded authorization
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SCRIBE_DROP_STAGING_GPU_EXECUTION_ADMISSION: paused
        run: |
          pnpm run cloudflare:config:staging:orchestrator
          pnpm exec wrangler deploy "${RELEASE_CANDIDATE_DIRECTORY}/orchestrator/index.js" \
            --no-bundle \
            --strict \
            --tag "candidate-${GITHUB_SHA}" \
            --message "release candidate ${GITHUB_SHA}" \
            --config .wrangler/deploy/orchestrator-staging.toml \
            --env staging

      - name: Deploy the candidate controller with authorization disabled
        env:
          GOOGLE_OAUTH_ACCESS_TOKEN: ${{ steps.google-auth.outputs.access_token }}
          SCRIBE_DROP_CLOUD_RUN_EXPECTED_RESERVED_EXECUTIONS: "0"
        run: |
          pnpm run cloud-run:controller:deploy apply staging disabled \
            "${CLOUD_RUN_CANDIDATE_EVIDENCE_PATH}"

      - name: Prove the exact candidate runtime boundary without a GPU
        run: |
          pnpm run cloud-run:staging:bootstrap-preflight \
            "${CLOUD_RUN_CANDIDATE_EVIDENCE_PATH}"

      - name: Verify the complete known paid preflight before authorization
        env:
          GOOGLE_OAUTH_ACCESS_TOKEN: ${{ steps.google-auth.outputs.access_token }}
        run: |
          pnpm run cloud-run:staging:safety read
          pnpm run cloud-run:staging:paid-readiness \
            "${CLOUD_RUN_CANDIDATE_EVIDENCE_PATH}"

      - name: Authorize exact one bounded staging execution and deploy the candidate controller
        env:
          GH_TOKEN: ${{ github.token }}
          GOOGLE_OAUTH_ACCESS_TOKEN: ${{ steps.google-auth.outputs.access_token }}
        run: |
          workflow_created_at="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" --jq .created_at)"
          authorization_expiry="$(node -p 'new Date(Date.parse(process.argv[1]) + 2 * 60 * 60 * 1000).toISOString()' "${workflow_created_at}")"
          printf 'SCRIBE_DROP_CLOUD_RUN_AUTHORIZATION_EPOCH=phase16-smoke-%s-%s\n' \
            "${GITHUB_SHA}" "${GITHUB_RUN_ID}" >>"${GITHUB_ENV}"
          printf 'SCRIBE_DROP_CLOUD_RUN_AUTHORIZATION_VALID_UNTIL=%s\n' \
            "${authorization_expiry}" >>"${GITHUB_ENV}"
          SCRIBE_DROP_CLOUD_RUN_AUTHORIZATION_EPOCH="phase16-smoke-${GITHUB_SHA}-${GITHUB_RUN_ID}" \
            SCRIBE_DROP_CLOUD_RUN_AUTHORIZATION_VALID_UNTIL="${authorization_expiry}" \
            pnpm run cloud-run:controller:deploy apply staging smoke \
              "${CLOUD_RUN_CANDIDATE_EVIDENCE_PATH}"

      - name: Activate staging admission and render exact acceptance configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SCRIBE_DROP_STAGING_GPU_EXECUTION_ADMISSION: active
        run: |
          pnpm run cloudflare:config:staging
          pnpm run runpod:config:staging
          pnpm run environment:policy:export staging
          pnpm exec wrangler deploy "${RELEASE_CANDIDATE_DIRECTORY}/orchestrator/index.js" \
            --no-bundle \
            --strict \
            --tag "candidate-${GITHUB_SHA}" \
            --message "release candidate ${GITHUB_SHA}" \
            --config .wrangler/deploy/orchestrator-staging.toml \
            --env staging

      - name: Verify candidate and live resource read-back
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_PAGES_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          SCRIBE_DROP_STAGING_PAGES_PROJECT: ${{ vars.SCRIBE_DROP_STAGING_PAGES_PROJECT }}
          SCRIBE_DROP_STAGING_RUNPOD_ENDPOINT_ID: ${{ secrets.SCRIBE_DROP_STAGING_RUNPOD_ENDPOINT_ID }}
        run: |
          pnpm run candidate:verify "${RELEASE_CANDIDATE_DIRECTORY}"
          pnpm run cloudflare:readback:staging
          pnpm run cloudflare:access:verify:staging
          pnpm run runpod:preflight:staging

      - name: Verify authenticated data plane, then run real staging M4A lifecycle
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          mkdir -p "${RUNNER_TEMP}/staging-acceptance-cleanup"
          printf 'STAGING_FAILURE_EVIDENCE_PATH=%s\n' \
            "${RUNNER_TEMP}/staging-acceptance-cleanup/job.json" >>"${GITHUB_ENV}"
          STAGING_FAILURE_EVIDENCE_PATH="${RUNNER_TEMP}/staging-acceptance-cleanup/job.json" \
            pnpm run test:e2e:staging

      - name: Preserve only unresolved fixture identity for automatic recovery
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scribe-drop-staging-cleanup-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/staging-acceptance-cleanup/job.json
          if-no-files-found: ignore
          retention-days: 1

      - name: Verify exact-one Cloud Run cleanup and provider storage convergence
        env:
          GOOGLE_OAUTH_ACCESS_TOKEN: ${{ steps.google-auth.outputs.access_token }}
        run: pnpm run cloud-run:acceptance:clean staging

      - name: Disable staging controller authorization after cleanup
        env:
          GOOGLE_OAUTH_ACCESS_TOKEN: ${{ steps.google-auth.outputs.access_token }}
          SCRIBE_DROP_CLOUD_RUN_EXPECTED_RESERVED_EXECUTIONS: "1"
        run: |
          pnpm run cloud-run:controller:deploy apply staging disabled \
            "${CLOUD_RUN_CANDIDATE_EVIDENCE_PATH}"

      - name: Restore RunPod selection while preserving the Cloud Run reaper
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SCRIBE_DROP_STAGING_GPU_EXECUTION_ADMISSION: active
          SCRIBE_DROP_STAGING_GPU_EXECUTION_POLICY: runpod_serverless_v1
        run: |
          pnpm run cloudflare:config:staging:orchestrator
          pnpm exec wrangler deploy "${RELEASE_CANDIDATE_DIRECTORY}/orchestrator/index.js" \
            --no-bundle \
            --strict \
            --tag "candidate-${GITHUB_SHA}" \
            --message "release candidate ${GITHUB_SHA}" \
            --config .wrangler/deploy/orchestrator-staging.toml \
            --env staging
          pnpm run cloudflare:readback:staging

      - name: Verify final disabled zero state before issuing acceptance
        env:
          GOOGLE_OAUTH_ACCESS_TOKEN: ${{ steps.google-auth.outputs.access_token }}
        run: pnpm run cloud-run:staging:safety read

      - name: Issue short-lived staging acceptance
        env:
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          EXPECTED_CLOUD_RUN_CANDIDATE_RUN_ID: ${{ inputs.cloud_run_candidate_run_id }}
        run: |
          mkdir staging-acceptance
          pnpm run staging:acceptance:create \
            "${RELEASE_CANDIDATE_DIRECTORY}" \
            staging-acceptance
          EXPECTED_CANDIDATE_RUN_ID="${CANDIDATE_RUN_ID}" \
            EXPECTED_STAGING_RUN_ID="${GITHUB_RUN_ID}" \
            pnpm run staging:acceptance:verify \
              "${RELEASE_CANDIDATE_DIRECTORY}" \
              staging-acceptance

      - name: Upload immutable staging acceptance
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scribe-drop-staging-acceptance-${{ github.sha }}
          path: staging-acceptance
          if-no-files-found: error
          retention-days: 2

  recover-acceptance:
    name: Converge a failed staging acceptance to the safe state
    needs: acceptance
    if: ${{ always() && (needs.acceptance.result == 'failure' || needs.acceptance.result == 'cancelled') }}
    environment: staging
    permissions:
      actions: read
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      AUDIT_RETENTION_DAYS: ${{ vars.AUDIT_RETENTION_DAYS }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      EXPECTED_COMMIT_SHA: ${{ github.sha }}
      MULTIPART_RETENTION_HOURS: ${{ vars.MULTIPART_RETENTION_HOURS }}
      RELEASE_CANDIDATE_DIRECTORY: ${{ github.workspace }}/release-candidate
      RESULT_RETENTION_DAYS: ${{ vars.RESULT_RETENTION_DAYS }}
      SCRIBE_DROP_CANDIDATE_MIGRATIONS_DIR: ../../release-candidate/migrations
      SCRIBE_DROP_CLOUD_RUN_RECOVERY_EPOCH: phase16-smoke-${{ github.sha }}-${{ github.run_id }}
      SCRIBE_DROP_STAGING_ACCESS_AUDIENCE: ${{ vars.SCRIBE_DROP_STAGING_ACCESS_AUDIENCE }}
      SCRIBE_DROP_STAGING_ACCESS_TEAM_DOMAIN: ${{ vars.SCRIBE_DROP_STAGING_ACCESS_TEAM_DOMAIN }}
      SCRIBE_DROP_STAGING_CLOUD_RUN_CONTROLLER_HMAC_SECRET_VERSION: ${{ vars.SCRIBE_DROP_STAGING_CLOUD_RUN_CONTROLLER_HMAC_SECRET_VERSION }}
      SCRIBE_DROP_STAGING_CLOUD_RUN_CONTROLLER_ORIGIN: ${{ vars.SCRIBE_DROP_STAGING_CLOUD_RUN_CONTROLLER_ORIGIN }}
      SCRIBE_DROP_STAGING_CLOUD_RUN_RUNTIME_MODE: synthetic-shadow
      SCRIBE_DROP_STAGING_CLOUD_RUN_RUNTIME_SERVICE_ACCOUNT: ${{ vars.SCRIBE_DROP_STAGING_CLOUD_RUN_RUNTIME_SERVICE_ACCOUNT }}
      SCRIBE_DROP_STAGING_D1_DATABASE_ID: ${{ vars.SCRIBE_DROP_STAGING_D1_DATABASE_ID }}
      SCRIBE_DROP_STAGING_E2E_SERVICE_TOKEN_COMMON_NAME: ${{ vars.SCRIBE_DROP_STAGING_E2E_SERVICE_TOKEN_COMMON_NAME }}
      SCRIBE_DROP_STAGING_ORCHESTRATOR_ORIGIN: ${{ vars.SCRIBE_DROP_STAGING_ORCHESTRATOR_ORIGIN }}
      SCRIBE_DROP_STAGING_PAGES_ACCESS_AUDIENCE: ${{ vars.SCRIBE_DROP_STAGING_PAGES_ACCESS_AUDIENCE }}
      SCRIBE_DROP_STAGING_PAGES_PROJECT: ${{ vars.SCRIBE_DROP_STAGING_PAGES_PROJECT }}
      SCRIBE_DROP_STAGING_R2_HOST: ${{ vars.SCRIBE_DROP_STAGING_R2_HOST }}
      SCRIBE_DROP_STAGING_RUNPOD_GPU_IDS: ${{ vars.SCRIBE_DROP_STAGING_RUNPOD_GPU_IDS }}
      SCRIBE_DROP_STAGING_RUNPOD_IMAGE_VISIBILITY: ${{ vars.SCRIBE_DROP_STAGING_RUNPOD_IMAGE_VISIBILITY }}
      SCRIBE_DROP_STAGING_RUNPOD_REGISTRY_AUTH_ID: ${{ vars.SCRIBE_DROP_STAGING_RUNPOD_REGISTRY_AUTH_ID }}
      SCRIBE_DROP_STAGING_WEB_ORIGIN: ${{ vars.SCRIBE_DROP_STAGING_WEB_ORIGIN }}
      SOURCE_RETENTION_DAYS: ${{ vars.SOURCE_RETENTION_DAYS }}
    steps:
      - name: Check out release commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Volta
        uses: volta-cli/action@615a78f6c83e116339c53b94f3f82b4d6c0b7d18 # v5.0.0
        with:
          volta-version: 2.0.2

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Re-authenticate the isolated staging deployer for recovery
        id: google-auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: projects/601035271372/locations/global/workloadIdentityPools/scribe-drop-release/providers/github-staging-deployment
          service_account: sd-staging-deployer@scribe-drop.iam.gserviceaccount.com
          project_id: scribe-drop
          token_format: access_token
          access_token_lifetime: 3600s

      - name: Set up pinned Google Cloud CLI
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          version: 579.0.0
          project_id: scribe-drop

      - name: Export release version
        run: printf 'EXPECTED_RELEASE_VERSION=%s\n' "$(node -p "require('./package.json').version")" >>"${GITHUB_ENV}"

      - name: Download and verify immutable release candidate
        env:
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "${CANDIDATE_RUN_ID}" \
            --name "scribe-drop-release-candidate-${GITHUB_SHA}" \
            --dir "${RELEASE_CANDIDATE_DIRECTORY}"
          pnpm run candidate:verify "${RELEASE_CANDIDATE_DIRECTORY}"

      - name: Download and verify immutable Cloud Run candidate
        env:
          CLOUD_RUN_CANDIDATE_RUN_ID: ${{ inputs.cloud_run_candidate_run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${CLOUD_RUN_CANDIDATE_RUN_ID}" \
            >"${RUNNER_TEMP}/cloud-run-candidate-run.json"
          node scripts/verify-workflow-run.mjs \
            "${RUNNER_TEMP}/cloud-run-candidate-run.json" \
            .github/workflows/publish-cloud-run-candidate.yml \
            "${CLOUD_RUN_CANDIDATE_RUN_ID}"
          cloud_run_attempt="$(node -p "JSON.parse(require('node:fs').readFileSync(process.argv[1], 'utf8')).run_attempt" "${RUNNER_TEMP}/cloud-run-candidate-run.json")"
          gh run download "${CLOUD_RUN_CANDIDATE_RUN_ID}" \
            --name "scribe-drop-cloud-run-candidate-${GITHUB_SHA}-${CLOUD_RUN_CANDIDATE_RUN_ID}-${cloud_run_attempt}" \
            --dir cloud-run-candidate
          pnpm run cloud-run:candidate:evidence verify cloud-run-candidate/cloud-run-candidate.json
          printf 'CLOUD_RUN_CANDIDATE_EVIDENCE_PATH=%s\n' \
            "${GITHUB_WORKSPACE}/cloud-run-candidate/cloud-run-candidate.json" >>"${GITHUB_ENV}"

      - name: Pause all new GPU admission on the RunPod recovery policy
        id: pause-admission
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SCRIBE_DROP_STAGING_GPU_EXECUTION_ADMISSION: paused
          SCRIBE_DROP_STAGING_GPU_EXECUTION_POLICY: runpod_serverless_v1
        run: |
          pnpm run cloudflare:config:staging:orchestrator
          pnpm exec wrangler deploy "${RELEASE_CANDIDATE_DIRECTORY}/orchestrator/index.js" \
            --no-bundle \
            --strict \
            --tag "candidate-${GITHUB_SHA}" \
            --message "release candidate ${GITHUB_SHA}" \
            --config .wrangler/deploy/orchestrator-staging.toml \
            --env staging

      - name: Download unresolved fixture identity if one exists
        id: cleanup-evidence
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          artifact_name="scribe-drop-staging-cleanup-${GITHUB_SHA}-${GITHUB_RUN_ID}"
          artifact_count="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" \
            --jq "[.artifacts[] | select(.name == \"${artifact_name}\" and .expired == false)] | length")"
          case "${artifact_count}" in
            0)
              printf 'found=false\n' >>"${GITHUB_OUTPUT}"
              ;;
            1)
              mkdir -p "${RUNNER_TEMP}/staging-acceptance-cleanup"
              gh run download "${GITHUB_RUN_ID}" \
                --name "${artifact_name}" \
                --dir "${RUNNER_TEMP}/staging-acceptance-cleanup"
              test -s "${RUNNER_TEMP}/staging-acceptance-cleanup/job.json"
              printf 'found=true\n' >>"${GITHUB_OUTPUT}"
              ;;
            *)
              echo "Staging cleanup artifact identity is not unique" >&2
              exit 1
              ;;
          esac

      - name: Install fixed Playwright browser only for unresolved fixture recovery
        id: install-cleanup-browser
        if: ${{ always() && steps.cleanup-evidence.outcome == 'success' && steps.cleanup-evidence.outputs.found == 'true' }}
        continue-on-error: true
        run: pnpm --filter @scribe-drop/e2e exec playwright install --with-deps chromium

      - name: Delete the unresolved fixture through the authenticated owner path
        id: cleanup-fixture
        if: ${{ always() && steps.install-cleanup-browser.outcome == 'success' && steps.cleanup-evidence.outputs.found == 'true' }}
        continue-on-error: true
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          STAGING_FAILURE_EVIDENCE_PATH: ${{ runner.temp }}/staging-acceptance-cleanup/job.json
        run: pnpm --filter @scribe-drop/e2e run test:staging:failure-cleanup

      - name: Wait for the deployed reaper and Cloud Run resources to converge
        id: wait-convergence
        if: ${{ always() }}
        continue-on-error: true
        env:
          GOOGLE_OAUTH_ACCESS_TOKEN: ${{ steps.google-auth.outputs.access_token }}
        run: pnpm run cloud-run:staging:safety wait

      - name: Build the controller deployment verifier
        id: build-controller
        if: ${{ always() }}
        continue-on-error: true
        run: pnpm --filter @scribe-drop/gpu-controller build

      - name: Disable only this failed run's staging controller authorization
        id: disable-controller
        if: ${{ always() && steps.wait-convergence.outcome == 'success' && steps.build-controller.outcome == 'success' }}
        continue-on-error: true
        env:
          GOOGLE_OAUTH_ACCESS_TOKEN: ${{ steps.google-auth.outputs.access_token }}
        run: |
          pnpm run cloud-run:controller:deploy recover staging disabled \
            "${CLOUD_RUN_CANDIDATE_EVIDENCE_PATH}"

      - name: Reactivate RunPod only after Cloud Run is disabled and empty
        id: reactivate-runpod
        if: ${{ always() && steps.wait-convergence.outcome == 'success' && steps.disable-controller.outcome == 'success' }}
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SCRIBE_DROP_STAGING_GPU_EXECUTION_ADMISSION: active
          SCRIBE_DROP_STAGING_GPU_EXECUTION_POLICY: runpod_serverless_v1
        run: |
          pnpm run cloudflare:config:staging:orchestrator
          pnpm exec wrangler deploy "${RELEASE_CANDIDATE_DIRECTORY}/orchestrator/index.js" \
            --no-bundle \
            --strict \
            --tag "candidate-${GITHUB_SHA}" \
            --message "release candidate ${GITHUB_SHA}" \
            --config .wrangler/deploy/orchestrator-staging.toml \
            --env staging

      - name: Verify recovered staging safety without issuing acceptance
        id: verify-recovery
        if: ${{ always() && steps.disable-controller.outcome == 'success' && steps.reactivate-runpod.outcome == 'success' }}
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GOOGLE_OAUTH_ACCESS_TOKEN: ${{ steps.google-auth.outputs.access_token }}
          SCRIBE_DROP_STAGING_GPU_EXECUTION_ADMISSION: active
          SCRIBE_DROP_STAGING_GPU_EXECUTION_POLICY: runpod_serverless_v1
        run: |
          pnpm run cloudflare:config:staging:orchestrator
          pnpm run cloudflare:readback:staging
          pnpm run cloud-run:staging:safety read

      - name: Reject any incomplete automatic recovery action
        if: ${{ always() }}
        env:
          CLEANUP_BROWSER_OUTCOME: ${{ steps.install-cleanup-browser.outcome }}
          CLEANUP_EVIDENCE_OUTCOME: ${{ steps.cleanup-evidence.outcome }}
          CLEANUP_EVIDENCE_FOUND: ${{ steps.cleanup-evidence.outputs.found }}
          CLEANUP_FIXTURE_OUTCOME: ${{ steps.cleanup-fixture.outcome }}
          CONTROLLER_BUILD_OUTCOME: ${{ steps.build-controller.outcome }}
          CONTROLLER_OUTCOME: ${{ steps.disable-controller.outcome }}
          CONVERGENCE_OUTCOME: ${{ steps.wait-convergence.outcome }}
          FINAL_VERIFY_OUTCOME: ${{ steps.verify-recovery.outcome }}
          PAUSE_OUTCOME: ${{ steps.pause-admission.outcome }}
          RUNPOD_OUTCOME: ${{ steps.reactivate-runpod.outcome }}
        run: |
          test "${PAUSE_OUTCOME}" = "success"
          test "${CLEANUP_EVIDENCE_OUTCOME}" = "success"
          test "${CONVERGENCE_OUTCOME}" = "success"
          test "${CONTROLLER_BUILD_OUTCOME}" = "success"
          test "${CONTROLLER_OUTCOME}" = "success"
          test "${RUNPOD_OUTCOME}" = "success"
          test "${FINAL_VERIFY_OUTCOME}" = "success"
          if [ "${CLEANUP_EVIDENCE_FOUND}" = "true" ]; then
            test "${CLEANUP_BROWSER_OUTCOME}" = "success"
            test "${CLEANUP_FIXTURE_OUTCOME}" = "success"
          fi
